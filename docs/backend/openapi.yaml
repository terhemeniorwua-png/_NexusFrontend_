  /workspaces/{workspaceId}/webhooks:
    get:
      tags:
      - Outbound webhooks
      operationId: listWebhooks
      summary: List workspace webhook subscriptions
      description: Any active workspace member may list subscriptions. Signing secrets are never returned.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Workspace webhook subscriptions.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookSubscription'
        '401':
          description: Authentication is required.
        '403':
          description: The caller is not an active workspace member.
        '404':
          description: Workspace is unavailable to the caller.
    post:
      tags:
      - Outbound webhooks
      operationId: createWebhook
      summary: Create a workspace webhook subscription
      description: Requires workspace update permission. The signing secret is returned once, either as generated or as supplied.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
      responses:
        '201':
          description: Subscription created. The plaintext signing secret is included once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionWithSecretResponse'
        '400':
          description: Invalid URL
          events: null
          or request body.: null
        '401':
          description: Authentication is required.
        '403':
          description: The caller lacks workspace update permission.
  /workspaces/{workspaceId}/webhooks/{webhookId}:
    patch:
      tags:
      - Outbound webhooks
      operationId: updateWebhook
      summary: Update a workspace webhook subscription
      description: Requires workspace update permission. Supplying secret rotates the signing secret and returns it once.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookRequest'
      responses:
        '200':
          description: Updated subscription. The plaintext secret is included only when rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionWithSecretResponse'
        '400':
          description: Invalid URL
          events: null
          or request body.: null
        '401':
          description: Authentication is required.
        '403':
          description: The caller lacks workspace update permission.
        '404':
          description: Webhook is unavailable to the caller.
    delete:
      tags:
      - Outbound webhooks
      operationId: deleteWebhook
      summary: Delete a workspace webhook subscription
      description: Requires workspace update permission. Delivery history is deleted with the subscription.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Subscription deleted.
        '401':
          description: Authentication is required.
        '403':
          description: The caller lacks workspace update permission.
        '404':
          description: Webhook is unavailable to the caller.
  /workspaces/{workspaceId}/webhooks/{webhookId}/deliveries:
    get:
      tags:
      - Outbound webhooks
      operationId: listWebhookDeliveries
      summary: List webhook delivery attempts
      description: Any active workspace member may inspect delivery history.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Delivery history, newest first.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookDelivery'
        '401':
          description: Authentication is required.
        '403':
          description: The caller is not an active workspace member.
        '404':
          description: Webhook is unavailable to the caller.
  /workspaces/{workspaceId}/webhooks/{webhookId}/deliveries/{deliveryId}/retry:
    post:
      tags:
      - Outbound webhooks
      operationId: retryWebhookDelivery
      summary: Retry a webhook delivery
      description: Requires workspace update permission. Resets a failed or completed delivery to PENDING with zero attempts.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: deliveryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Delivery reset to pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryResponse'
        '401':
          description: Authentication is required.
        '403':
          description: The caller lacks workspace update permission.
        '404':
          description: Webhook or delivery is unavailable to the caller.
        '409':
          description: The delivery is already running.
  /billing/plans:
    get:
      tags:
