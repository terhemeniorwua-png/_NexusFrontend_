      description: Only an approved redaction request targeting a task comment can be applied. Unmatched text remains unchanged;
        the transaction completes the request and records a restricted audit event.
      security:
      - bearerAuth: []
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - matchText
              - replacementText
              additionalProperties: false
              properties:
                matchText:
                  type: string
                  minLength: 1
                  maxLength: 4000
                replacementText:
                  type: string
                  maxLength: 4000
      responses:
        '200':
          description: Approved target text replaced and request completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyRequestResponse'
        '403':
          description: An active platform privacy reviewer is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Request is not approved or the selected text is no longer present.
