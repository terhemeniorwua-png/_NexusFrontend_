        '201':
          description: Proposal created (or the existing proposal for the same idempotency key).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiActionProposalResponse'
        '403':
          description: The caller lacks permission for the proposed action.
        '404':
          description: A referenced project
          task or resource does not exist or is not accessible.: null
    get:
      tags:
      - AI
      operationId: listAiActionProposals
      summary: List the caller's AI action proposals in a workspace
      security:
      - bearerAuth: []
      parameters:
      - name: workspaceId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PROPOSED
          - APPROVED
          - REJECTED
          - EXECUTING
          - EXECUTED
          - FAILED
          - CANCELLED
          - EXPIRED
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Cursor page of proposals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiActionProposalListResponse'
  /ai/actions/proposals/{proposalId}:
    parameters:
    - name: proposalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - AI
      operationId: getAiActionProposal
      summary: Read an owned AI action proposal
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiActionProposalResponse'
        '404':
          description: Proposal does not exist for this user.
  /ai/actions/proposals/{proposalId}/approve:
    parameters:
    - name: proposalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - AI
      operationId: approveAiAction
      summary: Approve a proposed AI action
      description: The caller's permissions are re-checked. Expired proposals cannot be approved.
      security:
      - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiActionDecisionRequest'
      responses:
        '200':
          description: Proposal approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiActionProposalResponse'
        '409':
          description: Proposal is not pending (AI_ACTION_NOT_PENDING).
        '410':
          description: Proposal expired (AI_ACTION_EXPIRED).
  /ai/actions/proposals/{proposalId}/reject:
    parameters:
    - name: proposalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - AI
      operationId: rejectAiAction
      summary: Reject a proposed or approved AI action
      security:
      - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiActionDecisionRequest'
      responses:
        '200':
          description: Proposal rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiActionProposalResponse'
        '409':
          description: Proposal cannot be rejected in its current state.
  /ai/actions/proposals/{proposalId}/cancel:
    parameters:
    - name: proposalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - AI
      operationId: cancelAiAction
      summary: Cancel a proposed or approved AI action
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Proposal cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiActionProposalResponse'
        '409':
          description: Proposal cannot be cancelled in its current state.
  /ai/actions/proposals/{proposalId}/execute:
    parameters:
    - name: proposalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - AI
      operationId: executeAiAction
      summary: Execute an approved AI action
      description: Re-checks current permissions, transitions APPROVED→EXECUTING conditionally, and executes through the owning
        Nexus service. The same proposal cannot execute twice.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Proposal executed with an execution result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiActionProposalResponse'
        '409':
          description: Proposal is not approved or is already executing.
        '410':
          description: Approval expired.
