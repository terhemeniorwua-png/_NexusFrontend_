  /users/me/avatar:
    get:
      tags:
      - Users
      operationId: getMyAvatar
      summary: Read the signed-in account's private profile image
      security:
      - bearerAuth: []
      responses:
        '200':
          description: The re-encoded JPEG, PNG, or WebP image.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
