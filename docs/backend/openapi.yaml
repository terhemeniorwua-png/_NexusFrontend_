      schema:
        type: string
        format: uuid
    patch:
      tags:
      - Workspaces
      operationId: updateWorkspaceMemberRole
      summary: Change the role of a member
      description: 'The owner role is not part of the request: a workspace has exactly one

        owner and that role cannot be transferred.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
