          description: Authentication is required.
        '404':
          description: The signed-in account has no uploaded avatar.
    post:
      tags:
      - Users
      operationId: uploadMyAvatar
      summary: Upload a private profile image
      description: Upload one multipart `avatar` file. Type is detected from file bytes; MIME headers and filename are ignored.
        Defaults are 5 MiB, 4096 pixels per side, and 16 million pixels total. The image is re-encoded and metadata is stripped.
        Five upload/delete requests are allowed per user and IP per configured authentication rate-limit window.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - avatar
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: The updated profile; `avatarUrl` points to the authenticated avatar route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          description: Missing file or invalid multipart request.
        '401':
          description: Authentication is required.
        '413':
          description: Upload exceeds the byte
          dimension: null
          or pixel limit.: null
        '415':
          description: Unsupported or corrupt image.
        '429':
          description: Avatar upload rate limit reached.
        '503':
          description: Private object storage is not configured.
    delete:
      tags:
      - Users
      operationId: deleteMyAvatar
      summary: Remove the signed-in account's profile image
