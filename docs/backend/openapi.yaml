      description: Returns public, active workspaces matching the optional search term. Membership is still granted only through
        an invitation or an approved join request.
      security:
      - bearerAuth: []
      parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 80
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Public workspace results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveredWorkspacesResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/join:
    post:
      tags:
      - Workspaces
      operationId: requestWorkspaceJoinByCode
      summary: Request to join a workspace using a join code
      description: Creates a pending join request. The code is only returned when an authorized workspace administrator creates
        or rotates it.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinByCodeRequest'
      responses:
        '201':
          description: The pending join request.
          content:
            application/json:
              schema:
