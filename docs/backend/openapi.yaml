openapi: 3.1.0
info:
  title: Nexus Backend API
  version: 0.1.0
  description: "Nexus workspace and project management backend.\n\nPhase 1 provides the foundation (health, configuration,\
    \ error contract).\nPhase 3 adds the account lifecycle: registration, email verification,\nsessions, password recovery,\
    \ Google OpenID Connect, server-managed profile\nimages and optional TOTP two-factor authentication.\nThe backend provides\
    \ a signed transactional email provider webhook.\nWorkspace routes support workspace types, memberships, invitations,\n\
    public discovery, join codes, join requests and membership\nsuspension/restoration.\n\nAuthentication model:\n- The access\
    \ token is a short-lived JWT returned in the response body and\n  sent in the `Authorization: Bearer <token>` header.\
    \ It is never stored\n  in a cookie, so business endpoints are not vulnerable to CSRF.\n- The refresh token is an opaque\
    \ random value delivered in the httpOnly\n  `nexus_rt` cookie. Only its SHA-256 digest is stored in PostgreSQL.\n- The\
    \ refresh token rotates on every use. Presenting a rotated token\n  revokes every session of the account.\n- Requests\
    \ that rely on the `nexus_rt` cookie must also send the CSRF\n  token in the `x-csrf-token` header. The `nexus_csrf` cookie\
    \ alone is\n  not accepted, because a browser attaches cookies to cross-site requests\n  automatically.\n\n\nContract\
    \ audited and aligned to routes registered in src/routes/index.ts and module route files (including Socket.IO events via\
    \ x-socketio)."
servers:
- url: http://localhost:4000/api/v1
  description: Local development server
tags:
- name: Health
  description: Application liveness and dependency readiness
- name: Authentication
  description: Account registration, verification, sessions and recovery
- name: Users
  description: The signed-in user's own profile
- name: Webhooks
  description: Email provider callbacks, authenticated by HMAC signature
- name: Workspaces
  description: Workspaces, memberships, discovery, join requests and invitations
- name: Invitations
  description: Invitation links, their preview and their acceptance
- name: Teams
  description: Workspace-scoped teams and team membership
- name: Projects
  description: Workspace-scoped projects, visibility, project membership, activity, and milestones
- name: Billing
  description: Workspace subscription and payment management
- name: Integrations
  description: Personal and workspace integration connections
- name: Search
  description: Unified permission-filtered global search
- name: Outbound webhooks
  description: Workspace webhook subscriptions and durable deliveries
paths:
  /search:
    get:
      tags:
      - Search
      operationId: globalSearch
      summary: Search authorised workspace content
      description: Searches people, workspaces, teams, departments, projects, tasks, messages, conversations, files, documents,
        meetings, and channels across workspaces the caller can access. Results are filtered by current permissions. `data`
        is an array and pagination metadata is returned in `meta`.
      security:
      - bearerAuth: []
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: category
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - people
          - workspaces
          - teams
          - departments
          - projects
          - tasks
          - messages
          - conversations
          - files
          - documents
          - meetings
          - channels
          - announcements
          default: all
      - name: workspaceId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 25
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - relevance
          - recent
          default: relevance
      responses:
        '200':
          description: Permission-filtered results with pagination metadata.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchResult'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
                      hasMore:
                        type: boolean
                      category:
                        type: string
        '401':
          description: Authentication is required.
  /search/suggestions:
    get:
      tags:
      - Search
      operationId: searchSuggestions
      summary: Return lightweight search suggestions
      security:
      - bearerAuth: []
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: workspaceId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Up to eight ranked suggestions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchSuggestion'
        '401':
          description: Authentication is required.
  /search/recent:
    get:
      tags:
      - Search
      operationId: listRecentSearches
      summary: List the caller's recent searches
      security:
      - bearerAuth: []
      parameters:
      - name: workspaceId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The caller's recent search history. History is private to the caller.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RecentSearch'
        '401':
          description: Authentication is required.
    delete:
      tags:
      - Search
      operationId: clearRecentSearches
      summary: Clear the caller's recent searches
      security:
      - bearerAuth: []
      parameters:
      - name: workspaceId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Number of cleared history entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      deleted:
                        type: integer
        '401':
          description: Authentication is required.
  /analytics:
    get:
      tags:
      - Analytics
      operationId: getAnalyticsSnapshot
      summary: Return permission-filtered aggregated workspace metrics
      description: Returns workspace summaries, activity, project progress, task completion, member activity, meeting statistics,
        file usage and subscription info. Results are limited to workspaces the caller is a member of, or to a single workspace
        when `workspaceId` is supplied and the caller is a member. Results are cached for a short TTL.
      security:
      - bearerAuth: []
      parameters:
      - name: workspaceId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: projectId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: range
        in: query
        required: false
        schema:
          type: string
          enum:
          - 7d
          - 30d
          - 90d
          - custom
          default: 30d
      - name: startDate
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Permission-filtered analytics snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSnapshot'
        '401':
          description: Authentication is required.
        '403':
          description: Active workspace membership required.
        '400':
          description: Invalid or oversized date range.
  /analytics/tasks/by-status:
    get:
      tags: [Analytics]
      operationId: getAnalyticsTasksByStatus
      summary: Aggregate task counts by status
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: workspaceId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: projectId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: range, in: query, required: false, schema: { type: string, enum: [7d, 30d, 90d, custom], default: 30d } }
        - { name: startDate, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: endDate, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Tasks grouped by status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsTaskStatusResponse'
        '400': { description: Invalid or oversized date range }
        '401': { description: Authentication required }
        '403': { description: Workspace access denied }
        '404': { description: Project not found in workspace }
  /analytics/tasks/by-assignee:
    get:
      tags: [Analytics]
      operationId: getAnalyticsTasksByAssignee
      summary: Aggregate task counts by assignee
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: workspaceId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: projectId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: range, in: query, required: false, schema: { type: string, enum: [7d, 30d, 90d, custom], default: 30d } }
        - { name: startDate, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: endDate, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Tasks grouped by assignee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsTaskAssigneeResponse'
        '400': { description: Invalid or oversized date range }
        '401': { description: Authentication required }
        '403': { description: Workspace access denied }
        '404': { description: Project not found in workspace }
  /analytics/tasks/throughput:
    get:
      tags: [Analytics]
      operationId: getAnalyticsTasksThroughput
      summary: Task throughput (created vs completed) over time
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: workspaceId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: projectId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: range, in: query, required: false, schema: { type: string, enum: [7d, 30d, 90d, custom], default: 30d } }
        - { name: startDate, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: endDate, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Throughput metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsTaskThroughputResponse'
        '400': { description: Invalid or oversized date range }
        '401': { description: Authentication required }
        '403': { description: Workspace access denied }
        '404': { description: Project not found in workspace }
  /analytics/tasks/workload:
    get:
      tags: [Analytics]
      operationId: getAnalyticsTasksWorkload
      summary: Task workload by assignee (open/overdue)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: workspaceId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: projectId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: range, in: query, required: false, schema: { type: string, enum: [7d, 30d, 90d, custom], default: 30d } }
        - { name: startDate, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: endDate, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Workload metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsTaskWorkloadResponse'
        '400': { description: Invalid or oversized date range }
        '401': { description: Authentication required }
        '403': { description: Workspace access denied }
        '404': { description: Project not found in workspace }
  /analytics/time-logged:
    get:
      tags: [Analytics]
      operationId: getAnalyticsTimeLogged
      summary: Aggregate time logged (task time entries)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: workspaceId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: projectId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: range, in: query, required: false, schema: { type: string, enum: [7d, 30d, 90d, custom], default: 30d } }
        - { name: startDate, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: endDate, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Time logged totals and per-user breakdown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsTimeLoggedResponse'
        '400': { description: Invalid or oversized date range }
        '401': { description: Authentication required }
        '403': { description: Workspace access denied }
        '404': { description: Project not found in workspace }

  /integrations:
    get:
      tags:
      - Integrations
      operationId: listIntegrations
      summary: List integrations visible to the caller
      description: Without workspaceId, returns the caller's personal connections. With workspaceId, also returns workspace
        connections visible to that caller. Disconnected integrations are omitted.
      security:
      - bearerAuth: []
      parameters:
      - name: workspaceId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Visible integration connections. Tokens are never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationListResponse'
        '401':
          description: Authentication is required.
        '404':
          description: Workspace is unavailable to the caller.
    post:
      tags:
      - Integrations
      operationId: createIntegrationConnection
      summary: Save a connection for a provider without a dedicated OAuth flow
      description: Slack, Google Drive, Dropbox, and Gmail must use their dedicated OAuth endpoints. Tokens are encrypted
        before persistence and never returned.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntegrationRequest'
      responses:
        '201':
          description: Integration connection saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationResponse'
        '400':
          description: Invalid request or a dedicated OAuth flow is required.
        '401':
          description: Authentication is required.
        '404':
          description: Workspace is unavailable to the caller.
  /integrations/{integrationId}:
    patch:
      tags:
      - Integrations
      operationId: updateIntegration
      summary: Enable or disable an integration
      description: Personal connections can be changed only by their owner. Workspace connections require workspace update
        permission. Disabling pauses sync without deleting the connection.
      security:
      - bearerAuth: []
      parameters:
      - name: integrationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - enabled
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Updated integration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationResponse'
        '401':
          description: Authentication is required.
        '404':
          description: Integration is unavailable to the caller.
        '409':
          description: A disconnected integration cannot be re-enabled without reconnecting.
    delete:
      tags:
      - Integrations
      operationId: disconnectIntegration
      summary: Disconnect an integration
      description: Personal connections can be disconnected only by their owner. Workspace Slack connections require workspace
        update permission. The provider token is revoked when the provider supports revocation; provider-side data is never
        deleted.
      security:
      - bearerAuth: []
      parameters:
      - name: integrationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Integration marked disconnected.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                      providerRevoked:
                        type: boolean
        '401':
          description: Authentication is required.
        '404':
          description: Integration is unavailable to the caller.
  /integrations/{integrationId}/refresh:
    post:
      tags:
      - Integrations
      operationId: refreshIntegration
      summary: Refresh an integration access token
      description: Uses the provider refresh flow when one exists and records lastRefreshedAt. A provider failure marks the
        integration ERROR and returns the provider error.
      security:
      - bearerAuth: []
      parameters:
      - name: integrationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Refreshed integration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationResponse'
        '400':
          description: The provider has no refresh flow or the connection has no refresh token.
        '401':
          description: Authentication is required.
        '404':
          description: Integration is unavailable to the caller.
        '409':
          description: The integration is disconnected.
        '502':
          description: The provider rejected the refresh.
  /integrations/{integrationId}/sync:
    post:
      tags:
      - Integrations
      operationId: queueIntegrationSync
      summary: Queue a durable sync job
      description: Creates a PostgreSQL-backed IntegrationSyncJob. The sync worker processes it asynchronously and retries
        provider failures with bounded backoff.
      security:
      - bearerAuth: []
      parameters:
      - name: integrationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Sync job queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationSyncJobResponse'
        '401':
          description: Authentication is required.
        '404':
          description: Integration is unavailable to the caller.
        '409':
          description: The integration is disabled or disconnected.
  /integrations/{integrationId}/sync-jobs:
    get:
      tags:
      - Integrations
      operationId: listIntegrationSyncJobs
      summary: List sync job history
      security:
      - bearerAuth: []
      parameters:
      - name: integrationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Sync job history, newest first.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IntegrationSyncJob'
        '401':
          description: Authentication is required.
        '404':
          description: Integration is unavailable to the caller.
  /integrations/{integrationId}/sync-jobs/{jobId}/retry:
    post:
      tags:
      - Integrations
      operationId: retryIntegrationSyncJob
      summary: Retry a failed sync job
      description: Resets a failed or completed sync job to PENDING with zero attempts. A running job returns 409.
      security:
      - bearerAuth: []
      parameters:
      - name: integrationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Sync job reset to pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationSyncJobResponse'
        '401':
          description: Authentication is required.
        '404':
          description: Integration or sync job is unavailable to the caller.
        '409':
          description: The sync job is already running.
  /integrations/{integrationId}/status:
    get:
      tags: [integrations]
      operationId: getIntegrationStatus
      summary: Get integration sync/status
      security:
        - bearerAuth: []
      parameters:
        - name: integrationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /imports/dry-run:
    post:
      tags: [imports]
      operationId: createImportDryRun
      summary: Preview an import (dry-run, creates nothing)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Preview
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /imports:
    get:
      tags: [imports]
      operationId: listImports
      summary: List import jobs
      security:
        - bearerAuth: []
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { type: array, items: { type: object, additionalProperties: true } }
  /imports/{importId}:
    get:
      tags: [imports]
      operationId: getImportJob
      summary: Get import job/report
      security:
        - bearerAuth: []
      parameters:
        - name: importId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /imports/{importId}/confirm:
    post:
      tags: [imports]
      operationId: confirmImportJob
      summary: Confirm preview and enqueue execution (idempotent)
      security:
        - bearerAuth: []
      parameters:
        - name: importId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                idempotencyKey: { type: string }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /integrations/gmail/authorize:
    get:
      tags:
      - Integrations
      operationId: authorizeGmail
      summary: Start a personal Gmail OAuth flow
      description: workspaceId is accepted for frontend compatibility but ignored; the resulting connection belongs only to
        the signed-in user.
      security:
      - bearerAuth: []
      parameters:
      - name: workspaceId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Google consent URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GmailAuthorizeResponse'
        '401':
          description: Authentication is required.
        '503':
          description: Gmail OAuth is not configured.
  /integrations/gmail/callback:
    get:
      tags:
      - Integrations
      operationId: gmailOAuthCallback
      summary: Complete a personal Gmail OAuth flow
      description: Public Google redirect endpoint. Valid state and code are required to save the caller-bound personal connection.
        Redirects to the frontend integrations page with a status; tokens are not returned.
      security: []
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
          maxLength: 2000
      - name: state
        in: query
        required: true
        schema:
          type: string
          maxLength: 2000
      - name: error
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
      responses:
        '302':
          description: Redirect to the configured frontend with connected
          denied: null
          or error status.: null
  /integrations/google-drive/authorize:
    get:
      tags:
      - Integrations
      operationId: authorizeGoogleDrive
      summary: Start a workspace Google Drive OAuth flow
      security:
      - bearerAuth: []
      parameters:
      - name: workspaceId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Google consent URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GmailAuthorizeResponse'
        '401':
          description: Authentication is required.
        '404':
          description: Workspace is unavailable to the caller.
  /integrations/google-drive/callback:
    get:
      tags:
      - Integrations
      operationId: googleDriveOAuthCallback
      summary: Complete a workspace Google Drive OAuth flow
      security: []
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
          maxLength: 2000
      - name: state
        in: query
        required: true
        schema:
          type: string
          maxLength: 2000
