          type: string
          maxLength: 200
      - name: targetType
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
      - name: securityEvent
        in: query
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      responses:
