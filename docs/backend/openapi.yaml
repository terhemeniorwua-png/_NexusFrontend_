              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          description: Authentication is required.
        '429':
          description: Avatar upload/delete rate limit reached.
  /webhooks/email:
    post:
      tags:
      - Webhooks
      operationId: receiveEmailWebhook
      summary: Provider delivery, bounce and complaint events
      security: []
      description: "Public endpoint called by the email provider. The request is\nauthenticated by an HMAC signature over\
        \ the raw request body, not by a\nsession.\n\nThe signature is read from the header named by\n`EMAIL_WEBHOOK_SIGNATURE_HEADER`\
        \ (`x-nexus-signature` by default) and\nmust be one of:\n\n- `sha256=<hex digest>` — the HMAC-SHA256 of the raw body.\n\
        - `t=<unix seconds>,v1=<hex digest>` — the HMAC-SHA256 of\n  `<unix seconds>.<raw body>`. The timestamp must be inside\n\
        \  `EMAIL_WEBHOOK_TOLERANCE_SECONDS`.\n\nThe endpoint answers `200` for every verified payload, including\npayloads\
        \ that carry an unknown event, so the provider does not retry a\nmessage that will never be understood. Repeated events\
        \ are applied\nonce. A bounced or complained address is added to the suppression\nlist and stops receiving mail.\n\
        \nBrevo does not sign its events. The `/webhooks/email/{token}` route\naccepts the same payload and authenticates\
        \ it with the shared token\nof the URL.\n"
      parameters:
      - name: x-nexus-signature
        in: header
        required: false
        description: HMAC-SHA256 signature of the raw payload.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            examples:
              delivered:
                summary: A provider delivery report
                value:
                  type: delivered
                  data:
                    email_id: 01J8Z0Q9W4
                  created_at: 2026-10-21 12:00:00+00:00
              bounced:
                summary: A provider bounce report
                value:
                  type: bounced
                  data:
                    email_id: 01J8Z0Q9W4
                    bounce:
                      type: permanent
                  created_at: 2026-10-21 12:05:00+00:00
      responses:
        '200':
          description: The payload was received and verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailWebhookResponse'
        '400':
          description: The payload is empty or cannot be processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The signature is missing or not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The deployment has no webhook secret configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /webhooks/email/{token}:
    post:
      tags:
      - Webhooks
      operationId: receiveEmailWebhookWithToken
      summary: Provider events authenticated with the token of the URL
      security: []
      description: 'The same endpoint for providers that do not sign their events, Brevo

        among them. The token is the shared secret of the URL and is compared

        in constant time.

        '
      parameters:
      - name: token
        in: path
        required: true
        description: The shared token of the webhook URL.
        schema:
          type: string
          minLength: 32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            examples:
              brevoDelivered:
                summary: A Brevo delivery report
                value:
                  event: delivered
                  email: someone@example.com
                  message_id: <delivery-id@example.com>
                  ts: 1790000000
      responses:
        '200':
          description: The payload was received and verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailWebhookResponse'
        '400':
          description: The payload is empty or cannot be processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The token is missing or not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The deployment has no webhook secret configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /webhooks/paystack:
    post:
      tags:
      - Webhooks
      - Billing
      operationId: receivePaystackWebhook
      summary: Receive a signed Paystack event
      security: []
      description: 'The endpoint verifies Paystack''s timestamped `Paystack-Signature` as

        HMAC-SHA512 over the timestamp and exact raw request body using a

        server-only webhook signing secret. During header migration it also

        accepts the legacy `x-paystack-signature` when the new header is absent.

        Repeated payloads are deduplicated by their SHA-256 event key.

        '
      parameters:
      - name: Paystack-Signature
        in: header
        required: true
        description: Timestamped Paystack webhook signature.
        schema:
          type: string
      - name: x-paystack-signature
        in: header
        required: false
        description: Legacy migration fallback; do not configure for new integrations.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaystackWebhookRequest'
      responses:
        '200':
          description: The event was accepted for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaystackWebhookResponse'
        '400':
          description: The body is empty or contains invalid JSON or event data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The signature is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
