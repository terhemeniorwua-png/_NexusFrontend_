version: '3.8'

services:
  # Backend API Server
  backend:
    build: ./__NexusBackend__
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://nexus:nexus@db:5432/nexus
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=nexus-dev-secret-change-in-production
      - SOCKET_URL=http://backend:4000
    depends_on:
      - db
      - redis

  # Database
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=nexus
      - POSTGRES_USER=nexus
      - POSTGRES_PASSWORD=nexus_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Frontend
  frontend:
    build: ./__
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:4000
      - BACKEND_URL=http://localhost:4000
    depends_on:
      - backend

volumes:
  postgres_data:
