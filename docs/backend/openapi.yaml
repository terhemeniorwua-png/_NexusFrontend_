          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /billing/workspaces/{workspaceId}/checkout:
    parameters:
    - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags:
      - Billing
      operationId: createBillingCheckout
      summary: Start hosted checkout for a plan
      description: Only the workspace owner can start checkout. The backend calculates price and billable seats; a returned
        provider URL does not itself activate paid access.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingTargetRequest'
      responses:
        '201':
          description: Hosted checkout URL and server-generated transaction reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingCheckoutResponse'
        '400':
          description: Invalid billing target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Workspace owner access is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A checkout or billing state conflict prevents a new checkout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Billing request rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: USD billing is not configured or enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /billing/workspaces/{workspaceId}/verify:
    parameters:
    - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags:
      - Billing
      operationId: verifyBillingCheckout
      summary: Verify and fulfill a checkout
      description: The workspace owner submits the server-generated reference. The backend verifies transaction status, amount,
        and currency with Paystack before updating subscription state.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingVerifyRequest'
      responses:
        '200':
          description: Current subscription and seat summary after verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceBillingResponse'
        '402':
          description: Provider verification did not confirm the expected payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Workspace owner access is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Verification is processing or requires reconciliation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Billing request rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /billing/workspaces/{workspaceId}/change:
    parameters:
    - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags:
      - Billing
      operationId: scheduleBillingChange
      summary: Schedule a plan downgrade or seat reduction
      description: Lower-cost changes are scheduled for the current period end. Upgrades and seat increases require a verified
        checkout.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingTargetRequest'
      responses:
        '200':
          description: Scheduled plan change and effective date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingChangeResponse'
        '403':
          description: Workspace owner access is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Subscription state does not permit the requested schedule change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Billing request rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /billing/workspaces/{workspaceId}/cancel:
    parameters:
    - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags:
      - Billing
      operationId: cancelWorkspaceBilling
      summary: Cancel renewal at the end of the paid period
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Cancellation state and effective date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingCancellationResponse'
        '403':
          description: Workspace owner access is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No paid subscription was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Billing request rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workspaces/discover:
    get:
      tags:
