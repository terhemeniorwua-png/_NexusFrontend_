  /workspaces/{workspaceId}/projects/{projectId}/custom-fields:
    get:
      tags: [Tasks]
      operationId: listProjectCustomFields
      summary: List custom fields defined for a project
      parameters:
        - { in: path, name: workspaceId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: projectId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Custom fields, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '400': { description: Validation error (VALIDATION_ERROR), content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '401': { description: Authentication required (AUTHENTICATION_REQUIRED), content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '403': { description: Permission denied (INSUFFICIENT_ROLE/PERMISSION_DENIED), content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '404': { description: Not found (PROJECT_NOT_FOUND/WORKSPACE_NOT_FOUND), content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    post:
      tags: [Tasks]
      operationId: createProjectCustomField
      summary: Create a custom field for a project (types: TEXT, NUMBER, DATE, SELECT, MULTI_SELECT, USER, CHECKBOX)
      parameters:
        - { in: path, name: workspaceId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: projectId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                key: { type: string }
                type: { type: string, enum: [TEXT, NUMBER, DATE, SELECT, MULTI_SELECT, USER, CHECKBOX] }
                description: { type: string, nullable: true }
                options:
                  type: array
                  nullable: true
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      value: { type: string }
                      label: { type: string }
                      color: { type: string }
                    required: [value, label]
                required: { type: boolean }
                position: { type: integer }
              required: [name, type]
      responses:
        '201': { description: Created custom field, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '400': { description: Validation error (VALIDATION_ERROR), content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '401': { description: Authentication required, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '403': { description: Permission denied, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '404': { description: Project/workspace not found, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '409': { description: Conflict, content: { application/json: { schema: { type: object, additionalProperties: true } } } }

